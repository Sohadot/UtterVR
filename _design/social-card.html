<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UtterVR social card</title>
<!--
  Source for /assets/uttervr-social.jpg (1200x630 social master).
  Render with: node _design/render-social-card.mjs
  The world is drawn with the same grid / ripple / node language as the
  live page canvas, frozen at the moment the first pulse wakes it.
  All type sits inside the central safe area (see .safe) so 1.91:1 crops
  on LinkedIn and X lose nothing.
-->
<style>
@font-face{font-family:"Source Serif 4";font-weight:400;src:url(fonts/serif.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(fonts/mono.woff2) format("woff2")}
:root{
  --bg:#0D1124;
  --paper:#F2F0F7;
  --muted:#949CBD;
  --ghost:#9EA5C7;
  --voice:#F2C57C;
  --serif:"Source Serif 4","Iowan Old Style",Palatino,Georgia,serif;
  --sans:Inter,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
.card{
  position:relative;
  width:1200px;
  height:630px;
  overflow:hidden;
  background:var(--bg);
  color:var(--paper);
}
canvas{position:absolute;inset:0;width:1200px;height:630px}
.vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 80% at 50% 58%, transparent 0 40%, rgba(13,17,36,.55) 100%),
    linear-gradient(to bottom, rgba(13,17,36,.35), rgba(13,17,36,0) 45%, rgba(13,17,36,.35));
}
/* Central safe area: 1040x500, 80px side / 65px top-bottom margins. */
.safe{
  position:absolute;
  left:80px;right:80px;top:65px;bottom:65px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.mark{
  margin:14px 0 0;
  font:600 64px/1 var(--sans);
  letter-spacing:.22em;
  padding-left:.22em; /* optically re-centre tracked caps */
  color:var(--paper);
}
.rule{
  width:72px;height:1px;margin:32px 0 30px;
  background:linear-gradient(90deg,transparent,rgba(242,197,124,1),transparent);
}
h1{
  margin:0;
  font:400 54px/1.08 var(--serif);
  letter-spacing:-.02em;
}
h1 span{display:block}
h1 .ghost{color:var(--ghost)}
.tag{
  margin-top:auto;
  font:500 15px/1 var(--mono);
  letter-spacing:.2em;
  padding-left:.2em;
  text-transform:uppercase;
  color:var(--muted);
}
</style>
</head>
<body>
<div class="card" id="card">
  <canvas id="world" width="2400" height="1260"></canvas>
  <div class="vignette"></div>
  <div class="safe">
    <div class="mark">UTTERVR</div>
    <div class="rule"></div>
    <h1>
      <span>Virtual worlds are visual.</span>
      <span class="ghost">Presence is not.</span>
    </h1>
    <div class="tag">When virtual worlds begin to speak</div>
  </div>
</div>
<script>
(function(){
  const W=1200,H=630,DPR=2;
  const c=document.getElementById('world');
  const ctx=c.getContext('2d');
  ctx.setTransform(DPR,0,0,DPR,0,0);

  // Field: same palette as the live page, still "silent".
  const field=ctx.createRadialGradient(W*.5,H*.6,10,W*.5,H*.6,Math.max(W,H)*.72);
  field.addColorStop(0,'rgba(28,36,72,1)');
  field.addColorStop(.45,'rgba(18,24,52,1)');
  field.addColorStop(1,'rgba(13,17,36,1)');
  ctx.fillStyle=field;ctx.fillRect(0,0,W,H);

  // Perspective grid, horizon lowered so the type sits in open sky.
  const horizon=H*.64, cx=W*.5, depth=16, energy=.12;
  ctx.lineWidth=1;
  for(let i=-18;i<=18;i++){
    const g=ctx.createLinearGradient(0,horizon,0,H);
    g.addColorStop(0,'rgba(74,89,148,0.06)');
    g.addColorStop(1,`rgba(90,108,176,${.30+energy*.09})`);
    ctx.strokeStyle=g;
    ctx.beginPath();ctx.moveTo(cx+i*8,horizon);ctx.lineTo(cx+i*(W/15),H);ctx.stroke();
  }
  for(let j=0;j<depth;j++){
    const p=j/(depth-1);
    const y=horizon+Math.pow(p,1.85)*(H-horizon);
    ctx.strokeStyle=`rgba(83,100,164,${.07+p*(.26+energy*.08)})`;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  // Dormant nodes scattered in the world, not yet awake.
  [[.14,.74],[.27,.83],[.86,.77],[.74,.88],[.08,.9],[.94,.86]].forEach(([x,y])=>{
    ctx.fillStyle='rgba(139,151,205,.38)';
    ctx.beginPath();ctx.arc(x*W,y*H,2,0,Math.PI*2);ctx.fill();
  });

  // The single golden pulse, just beginning to spread across the floor.
  const px=W*.5, py=H*.765;
  const glow=ctx.createRadialGradient(px,py,0,px,py,260);
  glow.addColorStop(0,'rgba(242,197,124,.20)');
  glow.addColorStop(.35,'rgba(242,197,124,.06)');
  glow.addColorStop(1,'rgba(242,197,124,0)');
  ctx.save();ctx.translate(px,py);ctx.scale(1,.32);ctx.translate(-px,-py);
  ctx.fillStyle=glow;ctx.fillRect(px-300,py-300,600,600);ctx.restore();

  [[64,.6],[140,.36],[235,.18],[340,.07]].forEach(([r,a],k)=>{
    ctx.strokeStyle=`rgba(242,197,124,${a})`;ctx.lineWidth=1.3;
    ctx.beginPath();ctx.ellipse(px,py,r,r*.28,0,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=`rgba(167,199,255,${a*.4})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(px,py,r*1.25,r*.36,0,0,Math.PI*2);ctx.stroke();
  });

  // Source node.
  ctx.fillStyle='rgba(242,197,124,.95)';
  ctx.shadowColor='rgba(242,197,124,.9)';ctx.shadowBlur=18;
  ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(242,197,124,.28)';
  ctx.beginPath();ctx.arc(px,py,11,0,Math.PI*2);ctx.stroke();
})();
</script>
</body>
</html>
